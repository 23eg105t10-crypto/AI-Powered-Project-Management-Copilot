services:
  - type: web
    name: pm-copilot-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
  - type: web
    name: pm-copilot-ai-service
    env: python
    rootDir: ai-services
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
